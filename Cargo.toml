[workspace]
resolver = "2"
members = [
    "crates/ows-runtime-core",
    "crates/ows-runtime-expressions",
    "crates/ows-runtime-dsl",
    "crates/ows-runtime-events",
    "crates/ows-runtime-scheduler",
    "crates/ows-runtime-observability",
    "crates/ows-runtime-observability-otel",
    "crates/ows-runtime-stores",
    "crates/ows-runtime",
    "crates/ows-runtime-testing",
    "crates/ows-runtime-cli",
]
default-members = [
    "crates/ows-runtime",
    "crates/ows-runtime-testing",
    "crates/ows-runtime-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/open-workflow-specification/sdk-rust"
rust-version = "1.97"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "charset", "rustls-tls"] }
http = "1"
indexmap = { version = "2", features = ["serde"] }
url = "2"
regex = "1"
base64 = "0.22"
jsonschema = "0.18"
cron = "0.12"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
proptest = "1"
criterion = "0.5"

# Official Open Workflow Specification Rust SDK. Used as the primary
# representation of OWS workflow definitions.
serverless_workflow_core = { git = "https://github.com/open-workflow-specification/sdk-rust", rev = "12d7c5b2ef76bc5186f949e3a3d649db6a3f3ba5" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
